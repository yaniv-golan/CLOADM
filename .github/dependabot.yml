# The GitHub Actions used by .github/workflows/ get a weekly update proposal, one pull request per action. The
# workflows pin each action to a commit SHA and name the release tag beside it (a tag can be moved to other code; a
# SHA cannot), so a bump is read as the SHA and the tag together, by hand if Dependabot's own text names only the
# version. Nothing else is watched: the repository has no package.json and no runtime dependencies (AGENTS.md rule
# 1.2), and the one npm tool a workflow fetches (@anthropic-ai/mcpb in release.yml) is pinned in the command itself.
#
# The target is main, like every other proposal: an action bump changes CI for everyone, so it goes through the same
# review as any other change (the workflows are code, and `.github/workflows/` is in SECURITY.md's scope).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
