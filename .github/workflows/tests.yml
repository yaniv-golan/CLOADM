# The gates, on the commit the run checks out: every push to main and to contributor branches (claude/**,
# ds/**) gates the pushed head, and every pull request into main gates the MERGE of that pull request into main
# (GitHub's refs/pull/N/merge, so the `gates` summary's SHA is a merge commit, not the branch head -- the run is
# proof for the result of merging, which is what main would receive, not for the branch on its own).
# On demand for any other branch (workflow_dispatch). A green run on a commit is the definition of done for that exact commit (AGENTS.md section 4):
# `node tests/all.js` (which includes the regression gate), split into parts on parallel runners (`--shard i/n`), and
# every group of the browser check, split over parallel shards generated from measured group times. The final job,
# "gates", is green only if every other job passed and the all.js parts together ran every suite exactly once; its
# summary gives the commit, its tree hash, each job's pass/fail/skip counts and every FAIL line, so a reviewer can
# match the run to the tree they read. Attempt 1 is the gate and is never re-run (AGENTS.md 4.7). The whole browser
# check in one process runs daily in browser-daily.yml, which is not a gate.
#
# Every action is pinned to a full commit SHA with the release tag it is as a comment beside it: a tag can be moved
# to other code, a SHA cannot. Dependabot (.github/dependabot.yml) proposes the bump, with the tag. Never pin to a
# branch, `main` or a shorthand like v7, and never use pull_request_target: this workflow runs contributor code.
#
# No MAME and no ROMs: the project's hardware verification runs locally (node tools/mame-diff/run.js <profile>,
# with a MAME install), and every suite here runs on firmware written for this project or on synthetic images.
# Nothing in this workflow needs a copyrighted ROM, and nothing downloads one. Nor does it fetch the NitrOS-9
# release images (tools/nitros9/fetch.js is never run here): the browser check reports those cases as skipped.
#
# Playwright is a development tool, not a runtime dependency (AGENTS.md rule 1.2): it is installed here only to
# drive the pages, and the site itself stays plain ES modules with no build step.
#
# This workflow deploys nothing, and cannot: every job here is contents: read. The site is deployed by pages.yml, on a
# workflow_run of this one, because a called workflow's jobs may not ask for more than the caller grants (release.yml
# calls this file to gate a tag, with contents: read).
name: tests

on:
  push:
    branches: [main, 'claude/**', 'ds/**']
  # A pull request runs the gates too, so a branch whose push did not run (another account, a disabled workflow)
  # is still gated before it merges, and the PR shows its own check. It gates the MERGE result (refs/pull/N/merge),
  # not the branch head; the push run on the branch remains the proof for the branch itself. A fork's run uses the
  # fork's own workflow file and a read-only, secret-free token, so it is a signal from the contributor, not the
  # gate: the run on the branch after it lands is.
  # `pull_request`, never `pull_request_target`: this runs contributor code, and only with the read-only token below,
  # which `pull_request_target` would replace with the base repository's token and secrets.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called in place by release.yml, so a tag runs the same gates on the tagged commit before anything is published.
  # A reusable workflow runs only when its `on:` says so, and a caller cannot grant it more than the caller has: the
  # caller's `permissions` here is read-only, so the release's `gates` job gets exactly the token a branch run does.
  workflow_call:

# On a contributor branch a newer push cancels the run still in progress for an older commit of the same branch:
# that commit is superseded, and its result would verify nothing anyone reviews. On main every commit gets its own
# group (the SHA is in the name), so a main run is never cancelled, nor dropped from the queue by a later one.
# A pull request groups on refs/pull/N/merge, so a newer commit of the same PR supersedes the older run -- the same
# rule as a contributor branch, with the PR's merge ref as the branch.
# A RE-RUN (run_attempt > 1) never cancels anything, on any event: a re-run of an older commit exists precisely
# because someone wants that commit's result, and cancelling the newest head's run to make room would take away the
# run whose `gates` job is the answer being waited for.
# The event name is in the group because a push to a branch and the pull_request for the same ref could otherwise
# share one group and one would cancel the other.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.ref != 'refs/heads/main' }}

# Read-only: the workflow runs the suites and uploads artifacts, and needs to write nothing else.
permissions:
  contents: read

jobs:
  shards:
    name: browser-check shards are complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The same pinned Node as the suites: the check runs `tools/browser-check.js --list-groups`, which loads the
      # emulator's ES modules through require().
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # Fails if a browser-check group is in no shard, in two, or isn't a group at all; the matrix below is built
      # from the same file, so what is checked is what runs.
      - id: plan
        name: Check the shards cover every group, and plan the matrix
        run: |
          node .github/scripts/browser-check-shards.js
          echo "matrix=$(node .github/scripts/browser-check-shards.js --matrix)" >> "$GITHUB_OUTPUT"

  suites:
    name: node tests/all.js ${{ matrix.shard }}
    # Pinned, not ubuntu-latest: the image moves under us (it once went to 26.04, which the Playwright then pinned,
    # 1.55, had no chromium for) and a green run should mean the code changed, not the runner. Move this
    # deliberately, with the browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The gate in three parts on three runners (`node tests/all.js --shard i/n`, planned from tests/suite-times.json),
    # because one runner took 5-6 minutes for the whole of it. The parts are disjoint and cover every suite; the
    # `gates` job checks that from their logs (.github/scripts/suite-shards.js), so a part that never ran or a suite
    # that fell between them fails the gate. Change the count here only: n is read from the matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The whole history, with its tags: tests/changelog.test.js compares each released section of CHANGELOG.md with
      # the same section in its release tag, and a shallow checkout has no tags (the test fails on CI without them).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Run part ${{ matrix.shard }} of every suite
        run: |
          set -o pipefail
          node tests/all.js --shard '${{ matrix.shard }}/${{ strategy.job-total }}' --timings suite-times.json | tee all.log
      - name: Count
        if: always()
        run: |
          mkdir -p counts
          touch all.log
          printf '| suites (tests/all.js %s/%s) | %s | %s | %s | %s |\n' "${{ matrix.shard }}" "${{ strategy.job-total }}" "${{ job.status }}" \
            "$(grep -cE '^pass  [^ ]+\.test\.js ' all.log || true)" "$(grep -cE '^FAIL  [^ ]+\.test\.js ' all.log || true)" "-" > "counts/suites-${{ matrix.shard }}.md"
          cat "counts/suites-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          # the whole log goes to gates, which checks that the parts together ran every suite once
          cp all.log "counts/all-${{ matrix.shard }}.log"
          grep -E '^(FAIL|FAILED:)' all.log > "counts/fails-suites-${{ matrix.shard }}.txt" || true
          cp suite-times.json "counts/suite-times-${{ matrix.shard }}.json" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: counts-suites-${{ matrix.shard }}
          path: counts/

  pages:
    name: browser check ${{ matrix.shard }}
    needs: shards
    # Same pin, same reason - and here it matters more: Playwright's chromium is built per Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end even when another fails, so one run shows every failing group.
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # Playwright (and the browser it drives) is not committed: there is no package.json by design, so it is
      # installed here, pinned, with the version CI is verified against.
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund playwright@1.63.0
      # The browser download is cached on the Playwright version and the runner image (chromium is built per Ubuntu
      # release); a miss downloads it below, a hit makes that step a no-op.
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-ubuntu-24.04-chromium
      # The OS packages chromium needs that the runner image lacks (measured 2026-11-23: 9 font packages, ~32 MB) come
      # from an Ubuntu mirror, and a slow mirror made this step take 3-14 minutes on some shards. Their .deb files are
      # cached on the Playwright version and the runner image, so a hit installs them from disk with no network.
      - name: Cache the browser's OS packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-1.63.0-ubuntu-24.04-v1
      - name: Install the browser and its OS packages
        run: |
          npx playwright install chromium
          # Playwright's own check (`install-deps --dry-run`) simulates installing its exact package list
          # (apt-get install -s) and exits 1 naming what is missing. It decides every branch below, so the browser
          # check always runs with every package Playwright asks for, however they arrived.
          if npx playwright install-deps --dry-run chromium; then
            echo "OS packages: all present, nothing to install"; exit 0
          fi
          # From the cache: the same packages, from disk. Anything still missing afterwards falls through to apt.
          if ls ~/playwright-debs/*.deb >/dev/null 2>&1 \
            && sudo apt-get install -y --no-install-recommends ~/playwright-debs/*.deb \
            && npx playwright install-deps --dry-run chromium; then
            echo "OS packages: installed from the cache"; exit 0
          fi
          # From the mirror, keeping the downloaded .deb files for the cache. apt on a fresh runner sometimes cannot
          # find a package (a mirror mid-update): refresh and try again.
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          for try in 1 2 3; do
            if sudo apt-get update && npx playwright install-deps chromium; then
              mkdir -p ~/playwright-debs && cp /var/cache/apt/archives/*.deb ~/playwright-debs/ 2>/dev/null || true
              echo "OS packages: installed from the mirror; $(ls ~/playwright-debs/*.deb 2>/dev/null | wc -l) .deb files kept for the cache"
              exit 0
            fi
            echo "OS packages: try $try failed"; sleep $((try * 10))
          done
          exit 1
      - name: Run the browser check (${{ matrix.groups }})
        env:
          CHECK_GROUPS: ${{ matrix.groups }}
        run: |
          set -o pipefail
          node .github/scripts/browser-check-shards.js --shard '${{ matrix.shard }}' "$CHECK_GROUPS"
          node tools/browser-check.js --only "$CHECK_GROUPS" --screenshots browser-shots --timings timings.json | tee check.log
      - name: Count
        if: always()
        env:
          CHECK_GROUPS: ${{ matrix.groups }}
        run: |
          mkdir -p counts
          touch check.log
          printf '| browser check %s (%s) | %s | %s | %s | %s |\n' "${{ matrix.shard }}" "$CHECK_GROUPS" "${{ job.status }}" \
            "$(grep -c '^ok  ' check.log || true)" "$(grep -c '^FAIL' check.log || true)" "$(grep -ci '^skip' check.log || true)" \
            > "counts/pages-${{ matrix.shard }}.md"
          cat "counts/pages-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          grep -i '^skip' check.log >> "$GITHUB_STEP_SUMMARY" || true
          # the FAIL lines, for the gates summary; and this run's group times (node .github/scripts/browser-check-shards.js
          # --merge takes them into .github/browser-check-timings.json)
          grep -E '^FAIL' check.log > "counts/fails-pages-${{ matrix.shard }}.txt" || true
          cp timings.json "counts/timings-${{ matrix.shard }}.json" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: counts-pages-${{ matrix.shard }}
          path: counts/
      # Kept on every run, not only a failing one: AGENTS.md 4.7 asks for the screenshots of anything visual to be
      # looked at, and the green run is the proof a reviewer reads.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-check-screenshots-${{ matrix.shard }}
          retention-days: 14
          path: |
            browser-shots/
            *.png
          if-no-files-found: ignore

  gates:
    name: gates
    needs: [shards, suites, pages]
    # Runs even when a job it needs failed or was skipped, so that it reports and fails rather than being skipped
    # itself (a skipped job would leave nothing red to look at).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # pinned like the others: the shard count below comes from `tools/browser-check.js --list-groups`
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: counts-*
          path: counts
          merge-multiple: true
      - name: Summary, and fail unless every gate passed
        run: |
          {
            echo "## Gates"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            echo "- run attempt: ${{ github.run_attempt }}"
            if [ "${{ github.run_attempt }}" != "1" ]; then
              echo "- **re-run: attempt ${{ github.run_attempt }}; earlier attempts did not all pass.** Not a first-run pass: see AGENTS.md section 6."
            fi
            echo "- jobs: shards ${{ needs.shards.result }}, suites ${{ needs.suites.result }}, browser check ${{ needs.pages.result }}"
            echo
            echo "| job | result | pass | fail | skip |"
            echo "|---|---|---|---|---|"
            cat counts/*.md 2>/dev/null || true
            # every FAIL line of every part, by job, so a red run says what failed without opening each log
            for f in counts/fails-*.txt; do
              [ -s "$f" ] || continue
              echo
              echo "### FAIL lines: $(basename "$f" .txt | sed 's/^fails-//')"
              echo
              echo '```'
              head -n 60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # This run's browser-check group times, merged, for refreshing .github/browser-check-timings.json.
          if ls counts/timings-*.json >/dev/null 2>&1; then
            node .github/scripts/browser-check-shards.js --merge-out browser-check-timings.json counts/timings-*.json || true
          fi
          status=0
          # Every part of tests/all.js reported, and together they ran every suite exactly once, regress included.
          node .github/scripts/suite-shards.js counts/all-*.log || status=1
          # Every browser-check shard must have reported; a missing one is a failure, not a pass.
          want=$(node .github/scripts/browser-check-shards.js --matrix | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).include.length))')
          have=$(ls counts/pages-*.md 2>/dev/null | wc -l)
          echo "browser-check shards reported: $have of $want"
          test "$have" = "$want" || status=1
          test "${{ needs.shards.result }}" = success || status=1
          test "${{ needs.suites.result }}" = success || status=1
          test "${{ needs.pages.result }}" = success || status=1
          exit $status
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-check-timings
          path: browser-check-timings.json
          if-no-files-found: ignore
