# The whole browser check, once a day, in ONE process per branch: every group in the same browser, one after
# another, as `node tools/browser-check.js` runs on a contributor's machine. The gate (tests.yml) runs the groups split
# over parallel shards, so a group that only fails after another group has run in the same browser (shared state, a
# leaked context, load building up) cannot show there; this run is where it shows. AGENTS.md 4.7 describes it.
#
# NOT a gate: nothing waits for it, no branch needs it, and it never re-runs or excuses a gate run. A red run here is
# a bug report: its summary lists every FAIL line, and the screenshots and group times are kept. There is no
# quarantine and no skip list: a group that fails here is fixed, not hidden.
#
# A scheduled workflow runs from the default branch's copy of this file, so the schedule starts once it is on main;
# workflow_dispatch runs it by hand from any branch (Actions -> browser check (daily) -> Run workflow).
#
# Every action is pinned to a full commit SHA, as in tests.yml (see there). Read-only: it uploads artifacts and
# writes its summary, nothing else. No MAME, no ROMs, no NitrOS-9 images (those cases are reported as SKIP).
name: browser check (daily)

on:
  schedule:
    # 03:17 UTC: off the hour, outside the busiest hours for GitHub's scheduler
    - cron: '17 3 * * *'
  workflow_dispatch:

# One daily run at a time; a second (a manual run while the scheduled one is going) waits rather than competing.
concurrency:
  group: browser-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  whole:
    name: whole browser check (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    # the whole check is ~20 minutes of work on one runner; this only stops a hung run
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ref: [claude/v0.2-stage, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # The same Playwright, browser cache and OS packages as the gate's browser-check shards (tests.yml).
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-ubuntu-24.04-chromium
      # The OS packages chromium needs that the runner image lacks (measured 2026-11-23: 9 font packages, ~32 MB) come
      # from an Ubuntu mirror, and a slow mirror made this step take 3-14 minutes on some shards. Their .deb files are
      # cached on the Playwright version and the runner image, so a hit installs them from disk with no network.
      - name: Cache the browser's OS packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-1.63.0-ubuntu-24.04-v1
      - name: Install the browser and its OS packages
        run: |
          npx playwright install chromium
          # Playwright's own check (`install-deps --dry-run`) simulates installing its exact package list
          # (apt-get install -s) and exits 1 naming what is missing. It decides every branch below, so the browser
          # check always runs with every package Playwright asks for, however they arrived.
          if npx playwright install-deps --dry-run chromium; then
            echo "OS packages: all present, nothing to install"; exit 0
          fi
          # From the cache: the same packages, from disk. Anything still missing afterwards falls through to apt.
          if ls ~/playwright-debs/*.deb >/dev/null 2>&1 \
            && sudo apt-get install -y --no-install-recommends ~/playwright-debs/*.deb \
            && npx playwright install-deps --dry-run chromium; then
            echo "OS packages: installed from the cache"; exit 0
          fi
          # From the mirror, keeping the downloaded .deb files for the cache. apt on a fresh runner sometimes cannot
          # find a package (a mirror mid-update): refresh and try again.
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          for try in 1 2 3; do
            if sudo apt-get update && npx playwright install-deps chromium; then
              mkdir -p ~/playwright-debs && cp /var/cache/apt/archives/*.deb ~/playwright-debs/ 2>/dev/null || true
              echo "OS packages: installed from the mirror; $(ls ~/playwright-debs/*.deb 2>/dev/null | wc -l) .deb files kept for the cache"
              exit 0
            fi
            echo "OS packages: try $try failed"; sleep $((try * 10))
          done
          exit 1
      - name: Run the whole browser check in one process
        run: |
          set -o pipefail
          node tools/browser-check.js --screenshots browser-shots --timings timings.json | tee check.log
      - name: Summary
        if: always()
        env:
          REF: ${{ matrix.ref }}
        run: |
          touch check.log
          {
            echo "## Whole browser check: $REF"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- result: ${{ job.status }}"
            echo "- checks: $(grep -c '^ok  ' check.log || true) ok, $(grep -c '^FAIL' check.log || true) FAIL, $(grep -ci '^skip' check.log || true) SKIP"
            grep -E '^groups: ' check.log | tail -n 1 || true
            if grep -q '^FAIL' check.log; then
              echo
              echo "### FAIL lines"
              echo
              echo '```'
              grep -E '^(FAIL|FAILED group)' check.log | head -n 100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshots, the log and the group times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-daily-${{ strategy.job-index }}
          retention-days: 14
          path: |
            browser-shots/
            check.log
            timings.json
          if-no-files-found: ignore
