schema_version: "1.1"
name: basic-without-roms
expected_outcome: |
  The server has no ROMs, so BASIC is unavailable: boot says so. The agent tells the user BASIC needs their Color BASIC ROM (e.g. bas13.rom), does not claim the program ran or invent its output, and may offer or run an equivalent machine-code program instead, saying it is not BASIC. Advice on ROMs says they are given to the server (--roms or its config file).
